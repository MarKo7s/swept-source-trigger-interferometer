[project]
name = "pySSTri"
version = "1.0.0"
description = "Serial interface for the ModeLab swept-source interferometer PSOC5 camera trigger"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyserial>=3.5",
]

[project.optional-dependencies]
notebooks = [
  "matplotlib>=3.7",
  "jupyter>=1.0",
  "ipykernel>=6.0",
]

[project.urls]
Repository = "https://github.com/MarKo7s/swept-source-trigger-interferometer"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "pySSTri",
]
